<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng / Sửa Build - Median XL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="index.html" class="btn">Trang Chủ</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <div class="container" style="max-width: 1000px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;">
      <h2 id="form-heading" style="color: var(--accent-gold); margin: 0; font-size: 1.3rem;">POST A NEW TOPIC / TẠO BUILD MỚI</h2>
      <button type="button" class="btn btn-sm" onclick="FormHandler.importBuildCode()">📥 Nhập Mã Build</button>
    </div>

    <div id="login-warning" style="display: none; background: rgba(158, 42, 43, 0.2); border: 1px solid var(--accent-red); padding: 16px; border-radius: 6px; margin-bottom: 20px; text-align: center;">
      <p style="color: #ff8b8b;">Bạn cần đăng nhập để tiếp tục!</p>
      <button class="btn btn-primary" style="margin-top: 8px;" onclick="Auth.openModal('login')">Đăng nhập</button>
    </div>

    <!-- Input file ẩn phục vụ chức năng chọn ảnh tải lên -->
    <input type="file" id="image-upload-input" accept="image/*" style="display: none;" onchange="FormHandler.handleImageUpload(event)">

    <form id="build-form" onsubmit="FormHandler.handleSubmit(event)">
      <!-- Thông tin bài viết -->
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 16px;">
        <div class="form-group" style="margin: 0;">
          <label>Subject / Tên bài Build (*)</label>
          <input type="text" id="build-title" class="form-control" required placeholder="VD: [2.9] Bowzon Nuke Ubers Guide">
        </div>
        <div class="form-group" style="margin: 0;">
          <label>Class Nhân vật (*)</label>
          <select id="build-class" class="form-control" onchange="SkillPlanner.init(this.value)">
            <option value="Amazon">Amazon</option>
            <option value="Assassin">Assassin</option>
            <option value="Barbarian">Barbarian</option>
            <option value="Druid">Druid</option>
            <option value="Necromancer">Necromancer</option>
            <option value="Paladin">Paladin</option>
            <option value="Sorceress">Sorceress</option>
          </select>
        </div>
        <div class="form-group" style="margin: 0;">
          <label>Phiên bản Patch</label>
          <input type="text" id="build-patch" class="form-control" placeholder="2.9.1">
        </div>
      </div>

      <!-- Khung Skill Tree Planner -->
      <div id="skill-tree-container"></div>

      <!-- Trình soạn thảo BBCode Forum Style -->
      <div class="bb-editor-layout">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label style="color: var(--accent-gold); font-weight: bold; margin: 0;">Nội Dung Bài Viết (Hỗ trợ dán ảnh trực tiếp Ctrl + V)</label>
            <span id="upload-status" style="font-size: 0.8rem; color: var(--accent-gold); display: none;">⏳ Đang tải ảnh lên Google Drive...</span>
          </div>
          
          <!-- Thanh Toolbar BBCode -->
          <div class="bb-toolbar">
            <button type="button" class="bb-btn" title="In đậm" onclick="FormHandler.insertBB('[b]', '[/b]')">B</button>
            <button type="button" class="bb-btn" title="In nghiêng" onclick="FormHandler.insertBB('[i]', '[/i]')"><i>I</i></button>
            <button type="button" class="bb-btn" title="Gạch chân" onclick="FormHandler.insertBB('[u]', '[/u]')"><u>U</u></button>
            <button type="button" class="bb-btn" title="Trích dẫn" onclick="FormHandler.insertBB('[quote]', '[/quote]')">💬</button>
            <button type="button" class="bb-btn" title="Gạch đầu dòng" onclick="FormHandler.insertBB('[list]\n[*] ', '\n[/list]')">📜</button>
            
            <!-- Nút Upload ảnh lên Drive -->
            <button type="button" class="bb-btn" style="background: #e1f5fe; border-color: #0288d1; color: #01579b;" title="Tải ảnh lên Google Drive" onclick="document.getElementById('image-upload-input').click()">🖼️ Up Ảnh (Drive)</button>
            
            <button type="button" class="bb-btn" title="Chèn Link" onclick="FormHandler.insertBB('[url=https://]', '[/url]')">🔗</button>
            <button type="button" class="bb-btn" title="Video Youtube" onclick="FormHandler.insertBB('[youtube]', '[/youtube]')">▶️</button>
            <button type="button" class="bb-btn" title="Spoiler / Ẩn hiện" onclick="FormHandler.insertBB('[spoiler=Chi tiết]', '[/spoiler]')">📁</button>
            
            <button type="button" class="bb-btn" style="color: #d4af37;" title="Unique Item" onclick="FormHandler.insertBB('[item_u]', '[/item_u]')">Sacred Unique</button>
            <button type="button" class="bb-btn" style="color: #ed8936;" title="Runeword" onclick="FormHandler.insertBB('[rw]', '[/rw]')">Runeword</button>
            <button type="button" class="bb-btn" style="color: #48bb78;" title="Set Item" onclick="FormHandler.insertBB('[set]', '[/set]')">Set</button>

            <select class="bb-select" onchange="if(this.value){ FormHandler.insertBB('[size=' + this.value + ']', '[/size]'); this.value=''; }">
              <option value="">Cỡ chữ</option>
              <option value="12">Nhỏ (12px)</option>
              <option value="16">Vừa (16px)</option>
              <option value="20">Lớn (20px)</option>
            </select>

            <select class="bb-select" onchange="if(this.value){ FormHandler.insertBB('[color=' + this.value + ']', '[/color]'); this.value=''; }">
              <option value="">Màu chữ</option>
              <option value="#c79c5e">Vàng Gold</option>
              <option value="#ff4444">Đỏ</option>
              <option value="#44ff44">Xanh lá</option>
              <option value="#4488ff">Xanh dương</option>
            </select>
          </div>

          <textarea id="build-content" class="form-control" style="border-radius: 0 0 4px 4px; min-height: 350px; font-family: monospace; font-size: 0.95rem; line-height: 1.5;" placeholder="Nhập nội dung bài viết. Bạn có thể bấm nút 'Up Ảnh' hoặc bấm trực tiếp Ctrl + V để dán ảnh chụp màn hình vào đây..."></textarea>
        </div>

        <div>
          <div class="smilies-panel">
            <span style="color: var(--accent-gold); font-size: 0.85rem; font-weight: bold;">Smilies</span>
            <div class="smilies-grid">
              <span onclick="FormHandler.insertSmiley('😀')">😀</span>
              <span onclick="FormHandler.insertSmiley('😎')">😎</span>
              <span onclick="FormHandler.insertSmiley('🔥')">🔥</span>
              <span onclick="FormHandler.insertSmiley('⚔️')">⚔️</span>
              <span onclick="FormHandler.insertSmiley('🛡️')">🛡️</span>
              <span onclick="FormHandler.insertSmiley('💀')">💀</span>
              <span onclick="FormHandler.insertSmiley('👑')">👑</span>
              <span onclick="FormHandler.insertSmiley('⚡')">⚡</span>
              <span onclick="FormHandler.insertSmiley('❤️')">❤️</span>
              <span onclick="FormHandler.insertSmiley('🎯')">🎯</span>
              <span onclick="FormHandler.insertSmiley('💣')">💣</span>
              <span onclick="FormHandler.insertSmiley('🏆')">🏆</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 12px; text-align: left; line-height: 1.4;">
              Google Drive: <b>Active</b><br>
              Ctrl + V Image: <b>ON</b><br>
              BBCode: <b>ON</b><br>
              YouTube: <b>ON</b>
            </div>
          </div>
        </div>
      </div>

      <div id="preview-box" style="display: none; background: #0c0d0e; border: 1px solid var(--accent-gold); border-radius: 4px; padding: 16px; margin-top: 16px;">
        <h4 style="color: var(--accent-gold); margin-bottom: 8px;">👁️ Xem Trước Bài Viết (Preview):</h4>
        <div id="preview-content" class="markdown-rendered" style="line-height: 1.6;"></div>
      </div>

      <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
        <button type="button" class="btn" onclick="FormHandler.togglePreview()">👁️ Preview</button>
        <button type="button" class="btn" onclick="FormHandler.saveDraft()">💾 Save draft</button>
        <button type="submit" id="btn-save" class="btn btn-primary" style="padding: 10px 28px;">Submit / Đăng Bài</button>
      </div>
    </form>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="skill-tree.js"></script>
  <script src="form.js"></script>
  <script src="tooltip.js"></script>
</body>
</html>
