<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo / Sửa Hướng Dẫn Build - Median XL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Thanh Menu Điều Hướng -->
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="index.html" class="btn">Trang Chủ</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <!-- Khung Nhập Liệu Form -->
  <div class="container" style="max-width: 800px;">
    <div style="margin-bottom: 24px;">
      <h2 id="form-heading" style="color: var(--accent-gold);">Chia Sẻ Hướng Dẫn Build Mới</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Điền đầy đủ thông tin để chia sẻ cách build tối ưu cùng cộng đồng</p>
    </div>

    <!-- Cảnh báo nếu chưa đăng nhập -->
    <div id="login-warning" style="display: none; background: rgba(158, 42, 43, 0.2); border: 1px solid var(--accent-red); padding: 16px; border-radius: 6px; margin-bottom: 20px; text-align: center;">
      <p style="color: #ff8b8b; margin-bottom: 8px;">Bạn cần đăng nhập để có thể đăng hoặc chỉnh sửa bài viết!</p>
      <button class="btn btn-primary" onclick="Auth.openModal('login')">Đăng nhập ngay</button>
    </div>

    <form id="build-form" onsubmit="FormHandler.handleSubmit(event)">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Tên bài Build (*)</label>
          <input type="text" id="build-title" class="form-control" placeholder="VD: Bowzon Nuke Ubers Mùa 2.9" required>
        </div>
        <div class="form-group">
          <label>Class Nhân vật (*)</label>
          <select id="build-class" class="form-control" required>
            <option value="Amazon">Amazon</option>
            <option value="Assassin">Assassin</option>
            <option value="Barbarian">Barbarian</option>
            <option value="Druid">Druid</option>
            <option value="Necromancer">Necromancer</option>
            <option value="Paladin">Paladin</option>
            <option value="Sorceress">Sorceress</option>
          </select>
        </div>
        <div class="form-group">
          <label>Phiên bản Patch</label>
          <input type="text" id="build-patch" class="form-control" placeholder="VD: 2.9.1">
        </div>
      </div>

      <div class="form-group">
        <label>Điểm Cộng Thuộc Tính (Stats Distribution)</label>
        <textarea id="build-stats" class="form-control" placeholder="Mô tả cách tăng: Strength (đủ mặc đồ), Dexterity (max block), Vitality, Energy..."></textarea>
      </div>

      <div class="form-group">
        <label>Kỹ Năng & Skill Tree (*)</label>
        <textarea id="build-skills" class="form-control" style="min-height: 150px;" placeholder="Mô tả chi tiết: Kỹ năng chính, Masteries, Passives, Uberskills và thứ tự ưu tiên max điểm..." required></textarea>
      </div>

      <div class="form-group">
        <label>Trang Bị (Gear: Early / Mid / End game & Mystic Orbs) (*)</label>
        <textarea id="build-gear" class="form-control" style="min-height: 180px;" placeholder="Gợi ý trang bị từng giai đoạn: Vũ khí, Giáp, Runeword, MOs, Relics, Charms quan trọng..." required></textarea>
      </div>

      <div class="form-group">
        <label>Link Video Youtube Gameplay / Guide (nếu có)</label>
        <input type="url" id="build-video" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
      </div>

      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button type="submit" id="btn-save-build" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 12px; font-size: 1rem;">
          💾 Đăng Bài Viết
        </button>
        <a href="index.html" class="btn" style="padding: 12px 20px;">Hủy bỏ</a>
      </div>
    </form>
  </div>

  <!-- Nạp script -->
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="form.js"></script>
</body>
</html>
