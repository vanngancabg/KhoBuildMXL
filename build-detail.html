<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Build - Median XL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .gear-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .gear-table td { padding: 10px; border-bottom: 1px solid var(--border-color); }
    .gear-label { font-weight: bold; color: var(--accent-gold); width: 180px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="index.html" class="btn">← Trang Chủ</a>
      <a href="create-build.html" class="btn btn-primary">+ Viết Mới</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <div class="container" style="max-width: 900px;">
    <div id="detail-loading" style="text-align: center; padding: 40px; color: var(--accent-gold);">Đang tải dữ liệu...</div>

    <div id="detail-wrapper" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
        <div>
          <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
            <span id="detail-class" style="background: rgba(199, 156, 94, 0.15); color: var(--accent-gold); padding: 2px 8px; border-radius: 4px; font-weight: bold; border: 1px solid var(--accent-gold);"></span>
            <span id="detail-patch" style="color: var(--text-muted); font-size: 0.85rem;"></span>
          </div>
          <h1 id="detail-title" style="color: var(--accent-gold); font-size: 1.8rem; margin-bottom: 6px;"></h1>
          <div style="color: var(--text-muted); font-size: 0.85rem;">
            Tác giả: <span id="detail-author" style="color: var(--text-bright); font-weight: bold;"></span> • <span id="detail-time"></span>
          </div>
        </div>

        <div style="display: flex; gap: 8px;">
          <button id="btn-vote" class="btn" onclick="DetailHandler.toggleVote()">❤️ Thả Tim (<span id="vote-count">0</span>)</button>
          <div id="author-actions" style="display: none;">
            <a id="btn-edit" href="#" class="btn btn-primary">✏️ Sửa</a>
            <button class="btn btn-danger" onclick="DetailHandler.deleteBuild()">🗑️ Xóa</button>
          </div>
        </div>
      </div>

      <div id="video-section" class="detail-card" style="display: none;">
        <h3 style="color: var(--accent-gold); margin-bottom: 12px;">🎬 Gameplay Demo</h3>
        <div id="video-container" style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px;"></div>
      </div>

      <div class="detail-card">
        <h3 style="color: var(--accent-gold); margin-bottom: 10px;">📊 Điểm Thuộc Tính (Stats)</h3>
        <div id="detail-stats" class="markdown-rendered" style="line-height: 1.6;"></div>
      </div>

      <div class="detail-card">
        <h3 style="color: var(--accent-gold); margin-bottom: 10px;">⚡ Kỹ Năng (Skills Tree)</h3>
        <div id="detail-skills" class="markdown-rendered" style="line-height: 1.6;"></div>
      </div>

      <div class="detail-card">
        <h3 style="color: var(--accent-gold); margin-bottom: 10px;">🛡️ Trang Bị Đề Xuất (Gear & MOs)</h3>
        <div id="detail-gear"></div>
      </div>

      <!-- Bình Luận -->
      <div class="detail-card">
        <h3 style="color: var(--accent-gold); margin-bottom: 16px;">💬 Bình Luận & Góp Ý</h3>
        <div id="comment-box" style="margin-bottom: 20px;">
          <textarea id="comment-input" class="form-control" placeholder="Viết bình luận..." style="min-height: 80px;"></textarea>
          <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
            <button class="btn btn-primary" onclick="DetailHandler.postComment()">Gửi Bình Luận</button>
          </div>
        </div>
        <div id="comments-list"></div>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="detail.js"></script>
  <script src="tooltip.js"></script>
</body>
</html>
