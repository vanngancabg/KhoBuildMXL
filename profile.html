<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ Sơ Tác Giả - Median XL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
    }
    .rep-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      background: rgba(199, 156, 94, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="index.html" class="btn">← Trang Chủ</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <div class="container">
    <div id="profile-loading" style="text-align: center; padding: 40px; color: var(--accent-gold);">
      Đang tải hồ sơ tác giả...
    </div>

    <div id="profile-wrapper" style="display: none;">
      <div class="profile-header">
        <img id="p-avatar" class="profile-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
        <div>
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px;">
            <h2 id="p-name" style="color: var(--accent-gold);"></h2>
            <span id="p-badge" class="rep-badge">⭐ Member</span>
          </div>
          <p id="p-username" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px;"></p>
          <div style="font-size: 0.9rem; color: var(--text-bright); display: flex; gap: 16px;">
            <span>📚 Bài viết: <strong id="p-total-builds">0</strong></span>
            <span>❤️ Tổng Tim nhận: <strong id="p-total-votes" style="color: var(--accent-gold);">0</strong></span>
          </div>
        </div>
      </div>

      <h3 style="color: var(--accent-gold); margin-bottom: 16px;">Tất Cả Bài Build Đã Đăng</h3>
      <div class="grid" id="profile-builds-grid"></div>
      <div id="profile-empty" style="display: none; text-align: center; color: var(--text-muted); padding: 30px;">Tác giả này chưa đăng bài build nào.</div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
  <script src="tooltip.js"></script>
</body>
</html>
