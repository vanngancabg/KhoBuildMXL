<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diablo 2 Median XL - Kho Tàng Build</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Thanh Menu Điều Hướng -->
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="create-build.html" class="btn btn-primary">+ Viết Build Mới</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <!-- Khung Nội Dung Chính -->
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h1 style="color: var(--accent-gold); font-size: 1.6rem;">Danh Sách Build Nhân Vật</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Tổng hợp hướng dẫn xây dựng nhân vật từ cộng đồng Median XL</p>
      </div>
      <!-- Thanh tìm kiếm -->
      <div style="min-width: 260px; max-width: 400px; width: 100%;">
        <input type="text" id="search-input" class="form-control" placeholder="Tìm theo tên build, kỹ năng, tác giả..." oninput="App.handleSearch()">
      </div>
    </div>

    <!-- Thanh Lọc Theo 7 Class -->
    <div class="filter-bar" id="class-filters">
      <button class="filter-btn active" onclick="App.filterByClass('All', this)">Tất cả Class</button>
      <button class="filter-btn" onclick="App.filterByClass('Amazon', this)">Amazon</button>
      <button class="filter-btn" onclick="App.filterByClass('Assassin', this)">Assassin</button>
      <button class="filter-btn" onclick="App.filterByClass('Barbarian', this)">Barbarian</button>
      <button class="filter-btn" onclick="App.filterByClass('Druid', this)">Druid</button>
      <button class="filter-btn" onclick="App.filterByClass('Necromancer', this)">Necromancer</button>
      <button class="filter-btn" onclick="App.filterByClass('Paladin', this)">Paladin</button>
      <button class="filter-btn" onclick="App.filterByClass('Sorceress', this)">Sorceress</button>
    </div>

    <!-- Trạng thái tải trang -->
    <div id="loading-state" style="text-align: center; padding: 40px; color: var(--accent-gold);">
      Đang tải dữ liệu bài viết từ máy chủ...
    </div>

    <!-- Danh Sách Hiển Thị Bài Viết -->
    <div class="grid" id="builds-grid" style="display: none;"></div>
    
    <div id="empty-state" style="display: none; text-align: center; padding: 50px; color: var(--text-muted);">
      Chưa có bài viết nào phù hợp với bộ lọc.
    </div>
  </div>

  <!-- Nạp các file Javascript -->
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
