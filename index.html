<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện Build Median XL - Diablo 2</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">⚔️ MEDIAN XL BUILDS</a>
    <div class="nav-actions">
      <a href="create-build.html" class="btn btn-primary">+ Viết Build Mới</a>
      <div id="auth-section"></div>
    </div>
  </nav>

  <div class="container">
    <!-- Header Hero -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="color: var(--accent-gold); font-family: var(--font-heading); font-size: 1.8rem; margin-bottom: 4px;">Thư Viện Build</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
          <span>Chia sẻ và thảo luận chiến thuật cùng cộng đồng</span>
          <span style="background: rgba(199, 156, 94, 0.1); border: 1px solid var(--border-color); color: var(--accent-gold); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">
            🌐 Tổng lượt truy cập: <strong id="site-total-visits" style="color: var(--text-bright);">1</strong>
          </span>
        </p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button id="sort-votes-btn" class="btn" onclick="App.toggleSortVotes()">🔥 Top Yêu Thích</button>
        <input type="text" id="search-input" class="form-control" style="width: 220px;" placeholder="Tìm build hoặc tác giả..." oninput="App.handleSearch()">
      </div>
    </div>

    <!-- Bộ lọc Class -->
    <div class="filter-bar" style="margin-bottom: 24px;">
      <button class="filter-btn active" onclick="App.filterByClass('All', this)">Tất cả</button>
      <button class="filter-btn" onclick="App.filterByClass('Amazon', this)">Amazon</button>
      <button class="filter-btn" onclick="App.filterByClass('Assassin', this)">Assassin</button>
      <button class="filter-btn" onclick="App.filterByClass('Barbarian', this)">Barbarian</button>
      <button class="filter-btn" onclick="App.filterByClass('Druid', this)">Druid</button>
      <button class="filter-btn" onclick="App.filterByClass('Necromancer', this)">Necro</button>
      <button class="filter-btn" onclick="App.filterByClass('Paladin', this)">Paladin</button>
      <button class="filter-btn" onclick="App.filterByClass('Sorceress', this)">Sorc</button>
    </div>

    <!-- Danh sách bài viết -->
    <div id="loading-state" style="text-align: center; padding: 50px; color: var(--accent-gold);">Đang tải dữ liệu...</div>
    <div class="grid" id="builds-grid" style="display: none;"></div>
    <div id="empty-state" style="display: none; text-align: center; color: var(--text-muted); padding: 40px;">Không tìm thấy bài viết nào phù hợp.</div>
    <div id="pagination-container" class="pagination-bar" style="display: none; margin-top: 24px;"></div>

    <!-- Khung Chat Cộng Đồng (Shoutbox) -->
    <div class="shoutbox-container" style="margin-top: 40px;">
      <h3 style="color: var(--accent-gold); font-family: var(--font-heading); margin-bottom: 12px; font-size: 1.1rem;">💬 CHAT CỘNG ĐỒNG</h3>
      <div id="shoutbox-list" class="shoutbox-messages"></div>
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <input type="text" id="shoutbox-text" class="form-control" placeholder="Nhắn tin nhanh (Nhấn Enter để gửi)..." onkeydown="if(event.key==='Enter') App.sendChat()">
        <button class="btn btn-primary" onclick="App.sendChat()">Gửi</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
